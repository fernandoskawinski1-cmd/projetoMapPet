<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MapPet: ajudamos você a encontrar seu pet perdido e a resgatar animais em todo o Brasil.">
  <title>MapPet - Ajudando você a encontrar seu amigo de quatro patas</title>
  <link rel="icon" href="img/icone-pet.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== CABEÇALHO ===== -->
  <header class="header" id="topo">
    <button class="menu-btn" id="menu-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a href="index.html" class="logo" aria-label="MapPet - página inicial">
      <img src="img/logomapapet .png" alt="MapPet" class="logo-img">
    </a>

    <div class="header-links">
      <a href="#apoie" class="link-apoie">Apoie</a>
      <a href="#perfil" class="link-perfil">
        Perfil
        <span class="perfil-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="3"/>
            <path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/>
          </svg>
        </span>
      </a>
    </div>
  </header>

  <!-- ===== MENU LATERAL (MOBILE) ===== -->
  <nav class="menu" id="menu" aria-label="Menu principal" hidden>
    <a href="index.html">Início</a>
    <a href="#perdi">Perdi meu pet </a>
    <a href="#encontrei">Encontrei um pet</a>
    <a href="#apoie">Apoie</a>
    <a href="#perfil">Perfil</a>
  </nav>
  <div class="menu-fundo" id="menu-fundo" hidden></div>

  <!-- ===== HERO (PRIMEIRA TELA) ===== -->
  <main class="hero">
    <div class="hero-texto">
      <h1>Ajudando você a encontrar seu amigo de quatro patas</h1>
      <p class="subtitulo">Em todo o Brasil a procura e resgate dos nossos companheiros peludos</p>

      <div class="botoes">
        <a href="#perdi" class="btn btn-perdi" id="perdi">Perdi meu Pet</a>
        <a href="#encontrei" class="btn btn-encontrei" id="encontrei">Encontrei um pet</a>
      </div>
    </div>

    <div class="hero-imagem">
      <img src="img/foto-hero.jpg" alt="Mulher sorrindo abraçando um cachorro branco e marrom" class="foto-hero">

      <svg class="patinha patinha-1" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="65" rx="26" ry="22"/>
        <ellipse cx="22" cy="40" rx="9" ry="12"/>
        <ellipse cx="40" cy="25" rx="9" ry="12"/>
        <ellipse cx="60" cy="25" rx="9" ry="12"/>
        <ellipse cx="78" cy="40" rx="9" ry="12"/>
      </svg>
      <svg class="patinha patinha-2" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="65" rx="26" ry="22"/>
        <ellipse cx="22" cy="40" rx="9" ry="12"/>
        <ellipse cx="40" cy="25" rx="9" ry="12"/>
        <ellipse cx="60" cy="25" rx="9" ry="12"/>
        <ellipse cx="78" cy="40" rx="9" ry="12"/>
      </svg>
      <svg class="patinha patinha-3" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="65" rx="26" ry="22"/>
        <ellipse cx="22" cy="40" rx="9" ry="12"/>
        <ellipse cx="40" cy="25" rx="9" ry="12"/>
        <ellipse cx="60" cy="25" rx="9" ry="12"/>
        <ellipse cx="78" cy="40" rx="9" ry="12"/>
      </svg>
    </div>
  </main>

  <div class="faixa"></div>

  <script src="script.js"></script>
</body>
</html>
