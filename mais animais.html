<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="MapPet: ajudamos você a encontrar seu pet perdido e a resgatar animais em todo o Brasil.">

        <title>MapPet - Ajudando você a encontrar seu amigo de quatro patas</title>

        <link rel="icon" href="img/icone-pet.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

        <script src="https://kit.fontawesome.com/ae60c296d8.js" crossorigin="anonymous"></script>
    </head>

    <body>
        <header>
            <img src="img/logomapapet .png" alt="MapPet" class="logo-img">
            <i class="fa-solid fa-hand-holding-heart" aria-hidden="true"></i>
            <h3>Apoie</h3>
            <button class="perdi-pet">Perdi meu Pet</button>
            <!-- Aqui vai redirecionar para o botão cadastro -->
        </header>

        <br>
        <hr>
        <!-- Apenas para fazer a separação, pode retirar na etapa da estilização -->

        <!-- Filtros precisam do css para ficarem padronizados -->
        <h2><span class="titulo-filtro">Filtros</span> </h2>
        <form>
            <div class="campo-filtro">
                <label for="endereco-filtro">Endereço, Cidade ou CEP</label>
                <input type="text" id="endereco-filtro">
            </div>

            <div class="campo-filtro">
                <label for="nome-filtro">Nome ou ID</label>
                <input type="text" id="nome-filtro">
            </div>

            <div class="campo-filtro">
                <label for="raca-filtro">Raça</label>
                <input type="text" id="raca-filtro">
            </div>

            <div class="campo-filtro">
                <label for="porte-filtro">Porte</label>
                <input type="text" id="porte-filtro">
            </div>

            <div class="campo-filtro">
                <label for="cor-filtro">Cor</label>
                <input type="text" id="cor-filtro">
            </div>

            <div class="campo-filtro">
                <label for="idade-filtro">Idade</label>
                <input type="number" id="idade-filtro">
            </div>

            <div class="campo-filtro">
                <label>Espécie</label>

                <div class="especies">
                    <input type="checkbox" id="cachorro" value="Cachorro">
                    <label for="cachorro">Cachorro</label>

                    <input type="checkbox" id="gato" value="Gato">
                    <label for="gato">Gato</label>
                </div>
            </div>
            <br>
            <button type="submit">Pesquisar</button>
        </form>
        <br>
        <hr>
        <div class="card-juninho">
            <h3><span class="status-animal">Desaparecido</span></h3>
            <img src="./img/Juninho.png">
            <h2>Juninho</h2>
            <p class="raca1">Raça: Shih Tzu</p>
            <p class="cor1">Cor: caramelo</p>
            <p class="localizacao1">Visto por último em: Guarulhos - SP</p>
            <p class="horario1">12 horas atrás</p> 


        </div>
        

    </body>
</html>
